# Production: Caddy terminates HTTPS (certificates are automatic), the app and database are not reachable from the internet.
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rembo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rembo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rembo"], interval: 5s, retries: 20}
    networks: [internal]

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://rembo:${POSTGRES_PASSWORD}@db:5432/rembo
    depends_on: {db: {condition: service_healthy}}
    networks: [internal]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

networks:
  internal: {}
volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
