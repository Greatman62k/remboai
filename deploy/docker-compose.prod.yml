name: rembo
services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_started
    networks: [internal]
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-server-header", "--no-access-log", "--forwarded-allow-ips=*", "--limit-concurrency", "64", "--backlog", "128", "--timeout-keep-alive", "5"]
    environment:
      DATABASE_URL: postgresql://rembo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/rembo
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    volumes:
      - applogs:/tmp/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
        labels: "service=rembo"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rembo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rembo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rembo -d rembo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      # No migrations mounted here: the app applies and records every migration itself on start.
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redisdata:/data]
    networks: [internal]
networks:
  internal: {}
volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  applogs: {}
