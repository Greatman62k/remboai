<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 508" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where Meta AI fires</title>
  <desc id="d">A customer message goes to keyword rules first. If the rules are not sure it goes to Muse Spark, then Muse Spark Open, then back to keyword rules as a last resort. Every path ends in a guarded action.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 14px; font-weight: 600; }
    .m { font-size: 14px; font-weight: 600; fill: #fff; text-anchor: start; }
    .k { fill: #000; }
    .w { fill: #fff; }
    .ln { stroke: #fff; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
  </defs>
  <rect width="520" height="508" rx="16" fill="#000"/>

  <rect x="24" y="12" width="250" height="32" rx="16" fill="#fff"/>
  <text class="s k" x="149" y="33">Message (text or voice note)</text>
  <path class="ln" d="M60 44V70" marker-end="url(#a)"/>

  <rect x="24" y="70" width="250" height="56" rx="10" fill="#FF7A00"/>
  <text class="t w" x="149" y="95">Keyword rules</text>
  <text class="s w" x="149" y="115">Handles ~97%, no model call</text>

  <path class="ln" d="M60 126V164" marker-end="url(#a)"/>
  <text class="m" x="76" y="150">not sure</text>

  <rect x="24" y="164" width="250" height="56" rx="10" fill="#0057FF"/>
  <text class="t w" x="149" y="189">Muse Spark 1.3</text>
  <text class="s w" x="149" y="209">Meta Model API</text>

  <path class="ln" d="M60 220V258" marker-end="url(#a)"/>
  <text class="m" x="76" y="244">fails</text>

  <rect x="24" y="258" width="250" height="56" rx="10" fill="#E5101D"/>
  <text class="t w" x="149" y="283">Muse Spark Open</text>
  <text class="s w" x="149" y="303">Fallback model</text>

  <path class="ln" d="M60 314V352" marker-end="url(#a)"/>
  <text class="m" x="76" y="338">fails</text>

  <rect x="24" y="352" width="250" height="56" rx="10" fill="#FF7A00"/>
  <text class="t w" x="149" y="377">Rules, best guess</text>
  <text class="s w" x="149" y="397">Last resort, always answers</text>

  <!-- each tier has its own straight exit, nothing joins or crosses -->
  <path class="ln" d="M274 98H318" marker-end="url(#a)"/>
  <path class="ln" d="M274 192H318" marker-end="url(#a)"/>
  <path class="ln" d="M274 286H318" marker-end="url(#a)"/>
  <path class="ln" d="M274 380H318" marker-end="url(#a)"/>

  <rect x="318" y="70" width="178" height="338" rx="12" fill="#fff"/>
  <text class="k" x="407" y="200" style="font-size:20px;font-weight:700">Act</text>
  <text class="s k" x="407" y="232">Schema-coerced,</text>
  <text class="s k" x="407" y="252">clamped to the</text>
  <text class="s k" x="407" y="272">salon menu.</text>
  <text class="s k" x="407" y="312">The model never</text>
  <text class="s k" x="407" y="332">books, charges, or</text>
  <text class="s k" x="407" y="352">messages freely.</text>

  <rect x="24" y="428" width="472" height="56" rx="12" fill="#000" stroke="#fff" stroke-width="2"/>
  <text class="s w" x="260" y="451">Per-salon daily allowances and a circuit breaker:</text>
  <text class="s w" x="260" y="471">an outage degrades to rules. Calls are logged in model_calls.</text>
</svg>
