<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A booking, end to end</title>
  <desc id="d">A customer sends a voice note. RemboAI transcribes it, Muse Spark decides each step, the slot is held, asks for a deposit, sends an M-Pesa STK push to the salon's till, the customer enters their PIN, M-Pesa sends the paid callback, RemboAI confirms to the customer, notifies the owner, and schedules reminders.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .h { font-size: 17px; font-weight: 700; }
    .m { font-size: 14px; font-weight: 600; fill: #fff; }
    .n { font-size: 14px; font-weight: 600; }
    .nb { font-size: 14px; font-weight: 700; }
    .ln { stroke: #fff; stroke-width: 3; fill: none; }
    .gl { stroke: #00A651; stroke-width: 3; fill: none; }
    .life { stroke: #fff; stroke-width: 1.5; stroke-dasharray: 2 6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00A651"/></marker>
  </defs>
  <rect width="560" height="580" rx="16" fill="#000"/>

  <path class="life" d="M85 56V570"/>
  <path class="life" d="M285 56V570"/>
  <path class="life" d="M485 56V570"/>

  <rect x="25" y="16" width="120" height="40" rx="9" fill="#fff"/>
  <text class="h" x="85" y="42" fill="#000">Customer</text>
  <rect x="225" y="16" width="120" height="40" rx="9" fill="#FF7A00"/>
  <text class="h" x="285" y="42" fill="#fff">RemboAI</text>
  <rect x="425" y="16" width="120" height="40" rx="9" fill="#00A651"/>
  <text class="h" x="485" y="42" fill="#000">M-Pesa</text>

  <text class="m" x="185" y="90">nataka fade kesho</text>
  <path class="ln" d="M85 100H285" marker-end="url(#a)"/>

  <rect x="140" y="116" width="290" height="52" rx="10" fill="#0057FF"/>
  <text class="n" x="285" y="137" fill="#fff">Voice note: omniASR_LLM_1B_v2</text>
  <text class="n" x="285" y="157" fill="#fff">Muse Spark reads it, picks the step</text>
  <rect x="140" y="178" width="290" height="52" rx="10" fill="#FF7A00"/>
  <text class="nb" x="285" y="199" fill="#fff">Hold the slot</text>
  <text class="n" x="285" y="219" fill="#fff">advisory lock + exclusion constraint</text>

  <text class="m" x="185" y="258">Fade Tue 10:00, KES 200?</text>
  <path class="ln" d="M285 268H85" marker-end="url(#a)"/>

  <text class="m" x="185" y="302">M-Pesa phone number</text>
  <path class="ln" d="M85 312H285" marker-end="url(#a)"/>

  <text class="m" x="385" y="346">STK push to salon's till</text>
  <path class="gl" d="M285 356H485" marker-end="url(#g)"/>

  <!-- PIN step lives on the customer's own lane so no arrow crosses RemboAI's line -->
  <rect x="10" y="372" width="150" height="52" rx="10" fill="#00A651"/>
  <text class="nb" x="85" y="393" fill="#000">PIN prompt</text>
  <text class="n" x="85" y="413" fill="#000">Enters their PIN</text>

  <text class="m" x="385" y="434">Paid callback</text>
  <path class="gl" d="M485 444H285" marker-end="url(#g)"/>

  <text class="m" x="185" y="478">Confirmed + receipt</text>
  <path class="ln" d="M285 488H85" marker-end="url(#a)"/>

  <rect x="140" y="508" width="290" height="52" rx="10" fill="#fff"/>
  <text class="n" x="285" y="529" fill="#000">Owner notified of the deposit</text>
  <text class="n" x="285" y="549" fill="#000">Reminders at 24h and 2h</text>
</svg>
