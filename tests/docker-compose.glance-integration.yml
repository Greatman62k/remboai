services:
  glance-integration-api:
    extends:
      file: docker-compose.test.yml
      service: test
    user: "1000:1000"
    volumes:
      - /tmp/remboai-glance-day5-user:/tmp/glance-integration
    environment:
      GLANCE_INTEGRATION_READY_FILE: /tmp/glance-integration/ready.json
      GLANCE_INTEGRATION_HOST_DIR: /tmp/remboai-glance-day5-user
      PYTHONPATH: /srv
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: ["python", "tests/day5_glance_integration_server.py"]
    networks:
      default:
        aliases: [app]

  glance-integration-caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ":8081"
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      glance-integration-api:
        condition: service_started
