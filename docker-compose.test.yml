services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: rembo_test
      POSTGRES_PASSWORD: rembo_test
      POSTGRES_DB: rembo_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rembo_test -d rembo_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  test-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build: .
    user: root
    working_dir: /srv
    volumes:
      - .:/srv
    environment:
      TEST_DATABASE_URL: postgresql://rembo_test:rembo_test@test-db:5432/rembo_test
      REDIS_URL: redis://test-redis:6379/0
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]
